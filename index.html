<!DOCTYPE html>
<html>

<head>
	<script src="hls.js"></script>
	<link crossorigin="anonymous" media="all" rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css">

</head>

<body>
<style>

	.container {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding-top: 10px;
		}



	#playlist {
			width: fit-content;
			border: 1px solid #ccc;
			padding: 10px;
			max-height: 400px;
			overflow-y: auto;
			flex-shrink: 0;
		}

		.playlist-item {
			width: 100%;
			padding: 10px;
			cursor: pointer;
			border-bottom: 1px solid #ddd;
		}

		.playlist-item.active {
			background-color: #007bff;
			color: white;
		}

		.playlist-item:hover {
			background-color: #f0f0f0;
		}

		/* ===== Subtitle controls ===== */
		#subtitle-bar {
			width: 100%;
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 10px;
			padding: 8px 0;
		}

		#subtitle-bar label.btn {
			margin-bottom: 0;
		}

		#sub-status {
			font-size: 13px;
			color: #555;
		}

		/* Make the native subtitle cues a bit nicer and keep <i> italics working */
		video::cue {
			background-color: rgba(0, 0, 0, 0.6);
			color: #fff;
			font-size: 1.1em;
			line-height: 1.4;
		}

		video::cue(i) {
			font-style: italic;
		}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<div class="container">
<video id="player" controls autoplay  playsinline="" class="videoCentered" style="width: 100%" >
	<track id="subtitleTrack" kind="subtitles" label="Phụ đề" srclang="vi" default>
</video>

<div id="subtitle-bar">
	<label class="btn btn-sm btn-secondary" style="margin:0;">
		Chọn file .srt
		<input type="file" id="srtFileInput" accept=".srt" style="display:none;">
	</label>

	<input type="text" id="srtUrlInput" class="form-control form-control-sm" style="width:260px;" placeholder="http://sub.com/1.srt">
	<button id="loadSubUrlBtn" class="btn btn-sm btn-primary" type="button">Nạp phụ đề từ URL</button>

	<button id="toggleSubBtn" class="btn btn-sm btn-outline-secondary" type="button">Tắt phụ đề</button>
	<span id="sub-status"></span>
</div>

	<div id="playlist">

		</div>
</div>


<script>

let playlist = [
		{ "message": "OK", "title": "thu thuat 1-556", "label": "Auto", "type": "hls", "file": "https://srv315.noundemnitier.cyou/aes/0/1844f3f54e113d2f6dd733e997f76d5446aaca0205febcb970a5a9b1ca681d5d/zscIPUjfKU7upiVsCSdYRA/1793548209/storage2/movies/wasabi-2001/8d2b9cb1b20f51b8355b1f4b48190773.mp4/index.m3u8", "sub": "" },

		]

		function renderPlaylist() {
				playlistContainer.innerHTML = "";
				playlist.forEach((video, index) => {
					const item = document.createElement("div");
					item.className = "playlist-item" + (index === currentIndex ? " active" : "");
					item.innerHTML = `
					<strong>${video.title}</strong>
					<p>${video.file}</p>
				`
					item.addEventListener("click", () => {
						currentIndex = index;
						loadVideo(currentIndex);
					});
					playlistContainer.appendChild(item);
				});
			}

			let player = document.querySelector('#player');


			const playlistContainer = document.getElementById("playlist");
				let currentIndex = 0;

				var config = {
					// Thời gian tối đa của bộ đệm (tính bằng giây)
					maxBufferLength: 300, // Đặt đủ lớn để chứa ít nhất 2 đoạn .ts (ví dụ: 2 x 10 giây)
					// Giới hạn tối đa của bộ đệm khi đầy
					maxMaxBufferLength: 700, // Đảm bảo không vượt quá quá nhiều
					// Bắt đầu tải ngay khi có dữ liệu
					autoStartLoad: true,
					// Số lượng tối đa các đoạn được tải trước cùng lúc
					maxBufferSize: 100 * 1000 * 1000, // 60MB - Giới hạn kích thước bộ đệm (tùy chỉnh nếu cần)
				  };

				 const hls = new Hls(config);


	document.addEventListener("DOMContentLoaded", function () {


		 hls.on(Hls.Events.MANIFEST_PARSED, function () {
		    player.play().then(() => {
			console.log('HLS autoplay thành công.');
		  }).catch((error) => {
			console.warn('HLS autoplay bị chặn:', error);
		  });
		  });

		// Hook lỗi
		hls.on(Hls.Events.ERROR, (event, data) => {
		  if (data.details === Hls.ErrorDetails.INTERNAL_ABORTED) {
				console.warn("Fragment loading was canceled:", data);
			  } else {
				console.error("HLS.js Error:", data);
			  }
		});

		hls.on(Hls.Events.BUFFER_EOS, () => {
			currentIndex = ++currentIndex%(playlist.length)
			loadVideo(currentIndex);
		});

		loadVideo(0)

		setupSubtitleControls();


	})





function loadVideo(index){
	if (Hls.isSupported()) {
	  hls.loadSource(
		playlist[index]['file']
	  );
	  hls.attachMedia(player);
	  renderPlaylist()
	} else {

	}

	// Nếu mục trong playlist có khai báo sẵn link phụ đề (.srt hoặc .vtt), tự load luôn
	const subUrl = playlist[index] && playlist[index]['sub'];
	clearSubtitle();
	loadSubtitleFromUrl(subUrl);
}

/* ========================================================================
   SUBTITLE (.srt) SUPPORT
   Thẻ <track> của HTML5 chỉ hiểu định dạng WebVTT (.vtt), không hiểu .srt
   trực tiếp, nên ta cần convert nội dung .srt -> .vtt rồi nạp bằng Blob URL.
   ======================================================================== */

let currentSubtitleBlobUrl = null; // để revoke khi đổi phụ đề khác, tránh rò rỉ bộ nhớ
let subtitlesEnabled = true;

// Chuyển nội dung .srt thành .vtt
function srtToVtt(srtContent) {
	let content = srtContent.replace(/\r+/g, ''); // bỏ ký tự \r (CRLF -> LF)

	// Timestamp trong .srt dùng dấu phẩy cho phần mili-giây (00:01:02,500)
	// trong khi .vtt bắt buộc dùng dấu chấm (00:01:02.500)
	content = content.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');

	return 'WEBVTT\n\n' + content.trim() + '\n';
}

// Nạp phụ đề từ nội dung .srt dạng text (dùng chung cho file local và link online)
function loadSubtitleFromSrtText(srtText, label) {
	const vttText = srtToVtt(srtText);
	const blob = new Blob([vttText], { type: 'text/vtt' });
	const url = URL.createObjectURL(blob);

	if (currentSubtitleBlobUrl) {
		URL.revokeObjectURL(currentSubtitleBlobUrl); // dọn URL cũ
	}
	currentSubtitleBlobUrl = url;

	const track = document.getElementById('subtitleTrack');
	track.src = url;
	track.label = label || 'Phụ đề';

	// Chờ track load xong rồi bật chế độ hiển thị
	track.onload = () => {
		applySubtitleVisibility();
	};
	// Một số trình duyệt không bắn 'load' cho <track> đáng tin cậy, nên set luôn textTracks sau một nhịp
	setTimeout(applySubtitleVisibility, 150);

	document.getElementById('sub-status').textContent = 'Đã nạp phụ đề: ' + (label || '');
}

// Nạp phụ đề từ 1 URL (.srt hoặc .vtt online, dùng cho field "sub" trong playlist)
function loadSubtitleFromUrl(url) {
	url = "https://script.google.com/macros/s/AKfycbwYvvivgy9hHDmwGGa0C5GulG5qHno5AiGe1W-ud1taiOjj6_0iFuX__YDLshQx9iQ/exec?ggid=1EY_dI-jTQKtrcXYJnhwdkY9Zmao6WT6R"
	fetch(url)
		.then(res => {
			if (!res.ok) throw new Error('HTTP ' + res.status);
			return res.text();
		})
		.then(text => {
			if (url.toLowerCase().endsWith('.vtt') || /^\s*WEBVTT/.test(text)) {
				// Đã là VTT sẵn rồi thì không cần convert
				const blob = new Blob([text], { type: 'text/vtt' });
				const blobUrl = URL.createObjectURL(blob);
				if (currentSubtitleBlobUrl) URL.revokeObjectURL(currentSubtitleBlobUrl);
				currentSubtitleBlobUrl = blobUrl;

				const track = document.getElementById('subtitleTrack');
				track.src = blobUrl;
				setTimeout(applySubtitleVisibility, 150);
				document.getElementById('sub-status').textContent = 'Đã nạp phụ đề online';
			} else {
				loadSubtitleFromSrtText(text, 'Phụ đề online');
			}
		})
		.catch(err => {
			console.warn('Không tải được phụ đề:', err);
			document.getElementById('sub-status').textContent = 'Không tải được phụ đề online';
		});
}

function clearSubtitle() {
	const track = document.getElementById('subtitleTrack');
	if (currentSubtitleBlobUrl) {
		URL.revokeObjectURL(currentSubtitleBlobUrl);
		currentSubtitleBlobUrl = null;
	}
	track.removeAttribute('src');
	document.getElementById('sub-status').textContent = '';
}

function applySubtitleVisibility() {
	const textTracks = player.textTracks;
	if (!textTracks || textTracks.length === 0) return;
	for (let i = 0; i < textTracks.length; i++) {
		textTracks[i].mode = subtitlesEnabled ? 'showing' : 'hidden';
	}
}

function setupSubtitleControls() {
	const fileInput = document.getElementById('srtFileInput');
	const toggleBtn = document.getElementById('toggleSubBtn');

	fileInput.addEventListener('change', function (e) {
		const file = e.target.files[0];
		if (!file) return;

		const reader = new FileReader();
		reader.onload = function (evt) {
			subtitlesEnabled = true;
			toggleBtn.textContent = 'Tắt phụ đề';
			loadSubtitleFromSrtText(evt.target.result, file.name);
		};
		reader.onerror = function () {
			document.getElementById('sub-status').textContent = 'Lỗi đọc file .srt';
		};
		// Đọc file .srt dạng text. Nếu file bị lỗi font (không phải UTF-8),
		// có thể thử đổi 'UTF-8' thành 'windows-1258' hoặc 'UTF-16' tùy nguồn phụ đề.
		reader.readAsText(file, 'UTF-8');
	});

	toggleBtn.addEventListener('click', function () {
		subtitlesEnabled = !subtitlesEnabled;
		toggleBtn.textContent = subtitlesEnabled ? 'Tắt phụ đề' : 'Bật phụ đề';
		applySubtitleVisibility();
	});

	const urlInput = document.getElementById('srtUrlInput');
	const loadUrlBtn = document.getElementById('loadSubUrlBtn');

	function loadFromUrlInput() {
		const url = urlInput.value.trim();
		if (!url) {
			document.getElementById('sub-status').textContent = 'Vui lòng nhập URL phụ đề';
			return;
		}
		subtitlesEnabled = true;
		toggleBtn.textContent = 'Tắt phụ đề';
		document.getElementById('sub-status').textContent = 'Đang tải phụ đề...';
		loadSubtitleFromUrl(url);
	}

	loadUrlBtn.addEventListener('click', loadFromUrlInput);
	// Cho phép nhấn Enter trong ô nhập URL thay vì phải bấm nút
	urlInput.addEventListener('keydown', function (e) {
		if (e.key === 'Enter') {
			e.preventDefault();
			loadFromUrlInput();
		}
	});
}

</script>
</html>
