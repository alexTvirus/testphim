<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<link crossorigin="anonymous" media="all" rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css">
</head>

<body>
<style>

	.container {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding-top: 10px;
		}

	#playlist {
			width: fit-content;
			border: 1px solid #ccc;
			padding: 10px;
			max-height: 400px;
			overflow-y: auto;
			flex-shrink: 0;
		}

		.playlist-item {
			width: 100%;
			padding: 10px;
			cursor: pointer;
			border-bottom: 1px solid #ddd;
		}

		.playlist-item.active {
			background-color: #007bff;
			color: white;
		}

		.playlist-item:hover {
			background-color: #f0f0f0;
		}

		/* Khung bọc iframe để giữ tỉ lệ 16:9, responsive */
		#player-wrapper {
			position: relative;
			width: 100%;
			padding-top: 56.25%; /* 16:9 */
			background: #000;
		}

		#player-wrapper iframe {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			border: 0;
		}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<div class="container">

	<div id="player-wrapper">
		<iframe id="player"
			src=""
			allow="autoplay; fullscreen; picture-in-picture"
			allowfullscreen>
		</iframe>
	</div>

	<div id="playlist">

	</div>
</div>


<script>

// Vì phụ đề đã được gắn cứng (burn-in) sẵn vào video trước khi upload,
// nên ở đây không cần xử lý .srt/.vtt gì nữa — chỉ cần đổi link embed.
let playlist = [
		{ "title": "thu thuat 1-556", "embed": "https://www.nimo.tv/embed/v-1880626764375786055" },
		// Thêm các mục khác ở đây, mỗi mục là 1 link embed khác nhau:
		// { "title": "video khác", "embed": "https://www.nimo.tv/embed/v-xxxxxxxxxxxxxxxx" },
	]

	const playlistContainer = document.getElementById("playlist");
	const playerFrame = document.getElementById("player");
	let currentIndex = 0;

	function renderPlaylist() {
		playlistContainer.innerHTML = "";
		playlist.forEach((video, index) => {
			const item = document.createElement("div");
			item.className = "playlist-item" + (index === currentIndex ? " active" : "");
			item.innerHTML = `
				<strong>${video.title}</strong>
				<p>${video.embed}</p>
			`;
			item.addEventListener("click", () => {
				currentIndex = index;
				loadVideo(currentIndex);
			});
			playlistContainer.appendChild(item);
		});
	}

	function loadVideo(index) {
		const item = playlist[index];
		if (!item) return;

		// Đổi src của iframe để chuyển sang video embed khác.
		// Lưu ý: vì đây là nội dung nhúng từ domain khác (nimo.tv),
		// không thể dùng JS để điều khiển play/pause/seek hay biết trạng thái
		// phát của video bên trong iframe (giới hạn Same-Origin Policy).
		playerFrame.src = item.embed;
		renderPlaylist();
	}

	document.addEventListener("DOMContentLoaded", function () {
		loadVideo(0);
	});

</script>
</body>
</html>
